---
# Docs: https://docs.couchbase.com/server/current/cli/cbcli/couchbase-cli-server-add.html
- name: Set the services for cluster initialization
  set_fact:
    server_add_services_csv: "{{ couchbase_nodes | selectattr('hostname', 'equalto', lookup('vars', couchbase_hostname_var) ) | map(attribute='services') | flatten | join(',') }}"
  when: couchbase_master is defined and lookup('vars', couchbase_hostname_var) != couchbase_master
  tags:
    - couchbase_configure
    - couchbase_add_nodes

- name: Add Nodes
  shell:
    cmd: |
      if /opt/couchbase/bin/couchbase-cli host-list \
        --cluster {{ couchbase_master }} \
        --username {{ couchbase_security.admin_user | default('Administrator') }} \
        --password '{{ couchbase_security.admin_password | default('password') }}' | \
        grep -q '{{ lookup('vars', couchbase_hostname_var) }}'; then
          echo "The node already exists in the cluster"
      else
        /opt/couchbase/bin/couchbase-cli server-add \
          --cluster {{ couchbase_master }} \
          --username {{ couchbase_security.admin_user | default('Administrator') }} \
          --password '{{ couchbase_security.admin_password | default('password') }}' \
          --server-add-username {{ couchbase_security.admin_user | default('Administrator') }} \
          --server-add-password '{{ couchbase_security.admin_password | default('password') }}' \
          --server-add {{ lookup('vars', couchbase_hostname_var) }} \
          --services '{{ server_add_services_csv | default('data,index,query') }}'
        fi
  when: couchbase_master is defined and lookup('vars', couchbase_hostname_var) != couchbase_master
  tags:
    - couchbase_configure
    - couchbase_add_nodes
